# Zensical configuration for sdkit v3 documentation

[project]
site_name = "sdkit v3"
site_description = "Reference documentation for sdkit v3 - a Stable Diffusion server built on stable-diffusion.cpp, controlled via an A1111-compatible HTTP API."
repo_url = "https://github.com/easydiffusion/sdkit"
repo_name = "easydiffusion/sdkit"

nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Running the server" = "server.md" },
  { "API" = [
      { "API conventions" = "api/index.md" },
      { "Models & options" = "api/models.md" },
      { "Image generation" = "api/generate.md" },
      { "Filters, upscaling & ControlNet" = "api/filters.md" },
  ] },
  { "Notes & troubleshooting" = "appendix.md" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/easydiffusion/sdkit"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/Z5q3HCAqzF"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}